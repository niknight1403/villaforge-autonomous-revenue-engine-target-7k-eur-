name: Stripe Webhook CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Start Stripe Mock
        run: |
          docker run -d -p 12111:12111 stripe/stripe-mock:latest
          echo "Waiting for stripe-mock on port 12111..."
          for i in {1..3}; do
            if nc -z localhost 12111; then
              echo "Stripe-mock is up!"
              exit 0
            fi
            echo "Attempt $i: Waiting 10s..."
            sleep 10
          done
          echo "Stripe-mock failed to start after 30s"
          exit 1

      - name: Run Tests
        env:
          STRIPE_MOCK_PORT: 12111
        run: pytest tests/test_monetization.py